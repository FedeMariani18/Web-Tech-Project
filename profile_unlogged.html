<!DOCTYPE html>
<html lang="it" class="m-0">
    <head>
        <title>Profile</title>
        <link rel="stylesheet" type="text/css" href="./css/style.css"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

        <!-- for special font -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=BBH+Bartle&display=swap" rel="stylesheet">

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    </head>
    <body>
        <header class="container-fluid">
            <div class="row align-items-center">
                <h1 class="col-2 col-md-6">UNINET</h1>
            </div>

            <div class="container-fluid">
                <nav class="d-flex justify-content-center gap-2 profile-icon-nav align-items-center">
                    <img src="resources/heart.png" alt="icon del cuore"/>
                    <img src="resources/user_icon.png" alt="icona dell'utente"/>
                    <img src="resources/notification.png" alt="icona delle notifiche"/>
                </nav>
            </div>
        </header>

        <!-- MAIN -->
        <main class="cnotainer-fluid">
        <div class="row justify-content-center m-0">
            <h2>Effettua il login o crea un
                account per utilizzare tutte
                le funzionalità</h2>

            <ul>
                <li class="mb-3 mt-3">
                    <div class="row justify-content-center">
                        <button class="col-8 btn btn-lg important-button border border-black rounded-3" type="submit">Login</button>    
                    </div>
                </li>
                <li class="mb-3">
                    <div class="row justify-content-center">
                        <a class="col-8 btn btn-lg border border-black rounded-3" href="create_an_account.html">Non hai un account?</a>
                    </div>
                </li>
            </ul>
        </div>
        </main>
    </body>
</html>
