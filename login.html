<!DOCTYPE html>
<html lang="it">
    <head>
        <title>Login</title>

        <link rel="stylesheet" type="text/css" href="./css/style.css"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

        <!-- for special font -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=BBH+Bartle&display=swap" rel="stylesheet">

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta charset="UTF-8">
    </head>
    
    <body>
        <header class="p-2">
            <h1 class="m-0" style="text-align: center;">LOGIN</h1>
        </header>
        <main>
            <form class="p-3" action="#" method="POST" enctype="">
                <ul class="list-group">
                    <li class="mb-3">
                        <label class="form-label" for="mail">Mail:</label>
                        <input class="form-control" type="text" id="" name="" value="" placeholder="Mail"/>
                    </li>
                    <li class="mb-3">
                        <label class="form-label" for="password">Password:</label>
                        <input class="form-control" type="password" id="" name="" value="" placeholder="Password"/>
                    </li>
                    <li class="mb-3 mt-3">
                        <div class="row justify-content-center">
                            <button class="col-8 btn btn-lg important-button border border-black rounded-3" type="submit">Login</button>    
                        </div>
                    </li>
                    <li class="mb-3">
                        <div class="row justify-content-center">
                            <a class="col-8 btn btn-lg border border-black rounded-3" href="create_an_account.html">Non hai un account?</a>
                        </div>
                    </li>
                </ul>
            </form>
        </main>
    </body>
</html>
