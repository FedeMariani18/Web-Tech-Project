<!DOCTYPE html>
<html lang="it" class="m-0">
    <head>
        <title>Edit Profile</title>
        <link rel="stylesheet" type="text/css" href="./css/style.css"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

        <!-- for special font -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=BBH+Bartle&display=swap" rel="stylesheet">

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    </head>
    <body>
        <header class="container-fluid">
            <div class="row align-items-center">
                <h1 class="col-2 col-md-6">UNINET</h1>
                <div class="col-10 col-md-6">
                    <nav class="d-flex justify-content-end gap-2">
                        <img src="resources/check_icon.png" alt="icon del cuore"/>
                    </nav>
                </div>
            </div>

            <div class="container-fluid">
                <nav class="d-flex justify-content-center gap-2 profile-icon-nav align-items-center">
                    <img src="resources/user_icon.png" alt="icona dell'utente"/>
                </nav>
            </div>
        </header>

        <!-- MAIN -->
        <main class="cnotainer-fluid">
            <form class="p-3" action="#" method="POST" enctype="">
                <ul class="list-group row justify-content-center">
                    <li class="mb-3">
                        <label class="form-label" for="foto">Aggiungi una foto:</label>
                        <input class="form-control" type="file" id="foto" accept=".jpg, .jpeg, .png">
                    </li>
                    <li class="mb-3 col-md-6">
                        <div class="row g-3 mb-2">
                            <label class="col form-label" for="nome">Nome:</label>
                            <label class="col form-label" for="cognome">Cognome:</label>
                        </div>
                        <div class="row g-3 mb-2">
                            <div class="col">
                                <input type="text" class="col form-control" id="" name="" value="" placeholder="Nome">
                            </div>
                            <div class="col">
                                <input type="text" class="col form-control" id="" name="" value="" placeholder="Cognome">
                            </div>
                        </div>
                    </li>
                    <li class="mb-3">
                        <div class="row g-3 mb-2">
                            <label class="col form-label" for="username">Username:</label>
                            <label class="col form-label" for="telefono">Numero di telefono:</label>
                        </div>
                        <div class="row g-3 mb-2">
                            <div class="col">
                                <input type="text" class="form-control" id="" name="" value="" placeholder="Username">
                            </div>
                            <div class="col">
                                <input type="text" class="form-control" id="" name="" value="" placeholder="Telefono">
                            </div>
                        </div>
                    </li>
                    <li class="mb-3">
                        <label class="form-label" for="mail">Mail:</label>
                        <input class="form-control" type="email" id="" name="" value="" placeholder="mail@gmail.com"/>
                    </li>
                    <li class="mb-3">
                        <label class="form-label" for="password">Password:</label>
                        <button class="btn btn-outline-secondary mb-1" type="button" id="togglePassword">
                        <span id="eyeIcon">Mostra</span>
                        </button>
                        <input class="form-control" type="password" id="" name="" value="" placeholder="Password"/>
                    </li>
                </ul>
            </form>
        </main>
    </body>
</html>
