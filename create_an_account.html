<!DOCTYPE html>
<html lang="it">
    <head>
        <title>Crea account</title>

        <link rel="stylesheet" type="text/css" href="./css/style.css"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

        <!-- for special font -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=BBH+Bartle&display=swap" rel="stylesheet">

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta charset="UTF-8">
    </head>
    
    <body>
        <header class="p-2">
            <h1 class="m-0" style="text-align: center;">CREA ANNUNCIO</h1>
        </header>
        <main>
            <form class="p-3" action="#" method="POST" enctype="">
                <ul class="list-group row justify-content-center">
                    <li class="mb-3">
                        <label class="form-label" for="foto">Aggiungi una foto:</label>
                        <input class="form-control" type="file" id="foto" accept=".jpg, .jpeg, .png">
                    </li>
                    <li class="mb-3 col-md-6">
                        <div class="row g-3 mb-2">
                            <label class="col form-label" for="nome">Nome:</label>
                            <label class="col form-label" for="cognome">Cognome:</label>
                        </div>
                        <div class="row g-3 mb-2">
                            <div class="col">
                                <input type="text" class="col form-control" id="" name="" value="" placeholder="Nome">
                            </div>
                            <div class="col">
                                <input type="text" class="col form-control" id="" name="" value="" placeholder="Cognome">
                            </div>
                        </div>
                    </li>
                    <li class="mb-3">
                        <div class="row g-3 mb-2">
                            <label class="col form-label" for="username">Username:</label>
                            <label class="col form-label" for="telefono">Numero di telefono:</label>
                        </div>
                        <div class="row g-3 mb-2">
                            <div class="col">
                                <input type="text" class="form-control" id="" name="" value="" placeholder="Username">
                            </div>
                            <div class="col">
                                <input type="text" class="form-control" id="" name="" value="" placeholder="Telefono">
                            </div>
                        </div>
                    </li>
                    <li class="mb-3">
                        <label class="form-label" for="data">Data:</label>
                        <input class="form-control" type="date" id="" name="" value=""/>
                    </li>
                    <li class="mb-3">
                        <label class="form-label" for="orario">Ora:</label>
                        <input class="form-control" type="time" id="" name="" value=""/>
                    </li>
                    <li class="mb-3">
                        <label class="form-label" for="nPartecipanti">Posti disponibili:</label>
                        <input class="form-control" type="number" id="" name="" value=""/>
                    </li>
                    <li class="mb-3">
                        <label class="form-label" for="posizione">Posizione:</label>
                        <div class="row g-3 mb-2">
                            <div class="col">
                                <input type="text" class="form-control" id="" name="" value="" placeholder="Indirizzo">
                            </div>
                            <div class="col-3">
                                <input type="text" class="form-control" id="" name="" value="" placeholder="Civico">
                            </div>
                        </div>
                        <div class="row g-3">
                            <div class="col">
                                <input type="text" class="form-control" placeholder="Città">
                            </div>
                            <div class="col">
                                <input type="text" class="form-control" placeholder="Comune">
                            </div>
                            <div class="col-3">
                                <input type="text" class="form-control" placeholder="Provincia">
                            </div>
                        </div>
                    </li>
                    <li class="mb-3">
                        <label class="form-label" for="categoria">Categoria:</label>
                        <select class="form-select" name="categoria" id="categoria">
                            <option value="">-------</option>
                            <option value="sport">Sport</option>
                            <option value="studio">Studio</option>
                            <option value="festa">Festa</option>
                        </select>
                    </li>
                    
                </ul>
            </form>

            <footer class="container-fluid">
                <div class="row justify-content-center p-3">
                    <button class="col-4 button border border-black rounded-3" type="submit">POSTA</button>
                </div>
            </footer>
        </main>
    </body>
</html>
