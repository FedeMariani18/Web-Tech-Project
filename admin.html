<!DOCTYPE html>
<html lang="it" class="m-0">
    <head>
        <title>Home</title>
        <link rel="stylesheet" type="text/css" href="./css/style.css"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

        <!-- for special font -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=BBH+Bartle&display=swap" rel="stylesheet">

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    </head>
    <body>
        <header class="container-fluid">
            <div class="row align-items-center">
                <h1 class="col-2 col-md-6">UNINET</h1>
                <div class="col-10 col-md-6">
                    <nav class="d-flex justify-content-end gap-2">
                        <a href="#"><img src="resources/heart.png" alt="icon del cuore"/></a>
                        <a href="#"></a><img src="resources/notification.png" alt="icona delle notifiche"/></a>
                        <a href="profile.html"><img src="resources/user_icon.png" alt="icona dell'utente"/></a>
                    </nav>
                </div>
            </div>
            
            <form class="container-fluid text-center" role="search">
                <div class="btn-group" role="group" aria-label="Basic radio toggle button group">
                    <input type="radio" class="btn-check" name="btnradio" id="btnradio1" autocomplete="off" checked>
                    <label class="btn btn-outline-secondary" for="btnradio1">Utenti</label>

                    <input type="radio" class="btn-check" name="btnradio" id="btnradio2" autocomplete="off">
                    <label class="btn btn-outline-secondary" for="btnradio2">Post</label>
                </div>
                <div class="row justify-content-center p-2">
                    <input class="col-6 rounded-5" id="search" type="search" placeholder="Search" aria-label="Search"/>
                    <button class="col-2 rounded-5 m-1" type="submit"><img src="resources/magnifying_glass_icon.png" alt="icona della lente d'ingrandimento"></button>
                </div>
            </form>
            
        </header>

        <!-- MAIN -->
        <main class="container-fluid mt-3">
            <table class="table table-secondary table-hover">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">username</th>
                        <th scope="col">nome</th>
                        <th scope="col">cognome</th>
                        <th scope="col">azioni</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th scope="row">1</th>
                        <td>Mark</td>
                        <td>Otto</td>
                        <td>@mdo</td>
                        <td>banna, visita</td>
                    </tr>
                </tbody>
            </table>

            <table class="table table-secondary table-hover">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">titolo</th>
                        <th scope="col">data</th>
                        <th scope="col">organizzatore</th>
                        <th scope="col">azioni</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th scope="row">1</th>
                        <td>Mark</td>
                        <td>Otto</td>
                        <td>@mdo</td>
                        <td>elimina, visita, modifica img</td>
                    </tr>
                </tbody>
            </table>
        </main>
    </body>
</html>
